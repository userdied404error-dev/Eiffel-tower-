<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Eiffel Tower Gallery</title>

        <style>
            body{
                  margin:0;
                        font-family:Arial, sans-serif;
                              background:#111;
                                    color:white;
                                          text-align:center;
                                              }

                                                  h1{
                                                        padding:20px;
                                                            }

                                                                .gallery{
                                                                      display:grid;
                                                                            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
                                                                                  gap:20px;
                                                                                        padding:20px;
                                                                                            }

                                                                                                .gallery img{
                                                                                                      width:100%;
                                                                                                            height:350px;
                                                                                                                  object-fit:cover;
                                                                                                                        border-radius:10px;
                                                                                                                            }

                                                                                                                                a{
                                                                                                                                      text-decoration:none;
                                                                                                                                          }

                                                                                                                                              button{
                                                                                                                                                    margin:20px;
                                                                                                                                                          padding:12px 25px;
                                                                                                                                                                border:none;
                                                                                                                                                                      border-radius:5px;
                                                                                                                                                                            background:gold;
                                                                                                                                                                                  cursor:pointer;
                                                                                                                                                                                        font-size:16px;
                                                                                                                                                                                            }
                                                                                                                                                                                              </style>
                                                                                                                                                                                              </head>

                                                                                                                                                                                              <body>

                                                                                                                                                                                                                          <img src="https://images.unsplash.com/photo-1549144511-f099e773c147?q=80&w=1200&auto=format&fit=crop">
